<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterBikes - Crear Usuario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2f1a 0%, #2d5a2d 50%, #4a7c4a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .mountain-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #2c5530 0%, #3a7d44 30%, #4fa564 60%, #87c990 100%);
            z-index: -2;
        }

        .mountain-range {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, transparent 0%, #1a3b1a 20%, #2d4a2d 100%);
            clip-path: polygon(0% 100%, 10% 70%, 20% 80%, 30% 60%, 40% 75%, 50% 50%, 60% 65%, 70% 45%, 80% 60%, 90% 40%, 100% 55%, 100% 100%);
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #2e7d32;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1000;
            border-bottom: 2px solid #4caf50;
        }

        .navbar h2 {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: rgba(76, 175, 80, 0.1);
            color: #2e7d32;
            border: 2px solid #4caf50;
        }

        .btn-primary:hover {
            background: #4caf50;
            color: white;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #4caf50;
            color: white;
        }

        .btn-secondary:hover {
            background: #388e3c;
            transform: translateY(-2px);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 100;
        }

        .section-title {
            font-size: 36px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2e7d32;
            font-weight: 600;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #c8e6c9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .role-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .role-card {
            border: 2px solid #c8e6c9;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .role-card:hover {
            border-color: #4caf50;
            transform: translateY(-3px);
        }

        .role-card.selected {
            border-color: #4caf50;
            background: #e8f5e8;
            transform: translateY(-2px);
        }

        .role-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 12px;
        }

        .strength-weak { color: #e74c3c; }
        .strength-medium { color: #f39c12; }
        .strength-strong { color: #27ae60; }

        .nature-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .nature-element {
            position: absolute;
            font-size: 16px;
            opacity: 0.6;
            animation: floatNature linear infinite;
        }

        @keyframes floatNature {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .role-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="mountain-background">
        <div class="mountain-range"></div>
    </div>

    <div class="nature-elements" id="natureElements"></div>

    <div class="navbar">
        <h2>🚴 MasterBikes - Crear Usuario</h2>
        <div class="nav-buttons">
            <a href="index.html" class="btn btn-primary">🏠 Inicio</a>
            <a href="gestion-usuarios.html" class="btn btn-primary">👥 Gestión Usuarios</a>
            <a href="dashboard.html" class="btn btn-primary">📊 Dashboard</a>
        </div>
    </div>

    <div class="container">
        <h1 class="section-title">➕ Crear Nuevo Usuario</h1>
        
        <div class="card">
            <h3>Información del Usuario</h3>
            <form class="form-grid" id="userForm">
                <div class="form-group">
                    <label>Nombre Completo *</label>
                    <input type="text" class="form-input" id="fullName" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" class="form-input" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" class="form-input" id="phone" placeholder="+56 9 1234 5678">
                </div>
                <div class="form-group">
                    <label>Nombre de Usuario *</label>
                    <input type="text" class="form-input" id="username" placeholder="Ej: juan.perez" required>
                </div>
                <div class="form-group">
                    <label>Contraseña *</label>
                    <input type="password" class="form-input" id="password" placeholder="Mínimo 8 caracteres" required>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña *</label>
                    <input type="password" class="form-input" id="confirmPassword" placeholder="Repita la contraseña" required>
                    <div class="password-strength" id="passwordMatch"></div>
                </div>

                <div style="grid-column: 1 / -1;">
                    <label>Seleccione Rol *</label>
                    <div class="role-cards">
                        <div class="role-card" data-role="user">
                            <div class="role-icon">👤</div>
                            <div class="role-name">Usuario</div>
                            <small>Cliente estándar</small>
                        </div>
                        <div class="role-card" data-role="seller">
                            <div class="role-icon">💰</div>
                            <div class="role-name">Vendedor</div>
                            <small>Gestión de ventas</small>
                        </div>
                        <div class="role-card" data-role="technician">
                            <div class="role-icon">🔧</div>
                            <div class="role-name">Técnico</div>
                            <small>Servicio técnico</small>
                        </div>
                        <div class="role-card" data-role="admin">
                            <div class="role-icon">⚙️</div>
                            <div class="role-name">Administrador</div>
                            <small>Acceso completo</small>
                        </div>
                    </div>
                </div>

                <div style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-secondary" style="width: 100%;">
                        Crear Usuario
                    </button>
                </div>
            </form>

            <div class="success-message" id="successMessage">
                ✅ Usuario creado exitosamente
            </div>
        </div>
    </div>

    <script>
        let selectedRole = 'user';

        function createNatureElements() {
            const container = document.getElementById('natureElements');
            const elements = ['🍃', '🌿', '🍂', '👤'];
            
            for (let i = 0; i < 10; i++) {
                const element = document.createElement('div');
                element.className = 'nature-element';
                element.textContent = elements[Math.floor(Math.random() * elements.length)];
                element.style.left = Math.random() * 100 + 'vw';
                element.style.animationDuration = (Math.random() * 15 + 15) + 's';
                element.style.animationDelay = Math.random() * 8 + 's';
                element.style.fontSize = (Math.random() * 10 + 10) + 'px';
                container.appendChild(element);
            }
        }

        function initializeForm() {
            const roleCards = document.querySelectorAll('.role-card');
            roleCards.forEach(card => {
                card.addEventListener('click', function() {
                    roleCards.forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedRole = this.dataset.role;
                });
            });

            roleCards[0].classList.add('selected');

            document.getElementById('password').addEventListener('input', checkPasswordStrength);
            document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);
            document.getElementById('userForm').addEventListener('submit', createUser);
        }

        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                return;
            }

            let strength = 'débil';
            let strengthClass = 'strength-weak';

            if (password.length >= 8) {
                strength = 'media';
                strengthClass = 'strength-medium';
            }
            if (password.length >= 12 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
                strength = 'fuerte';
                strengthClass = 'strength-strong';
            }

            strengthDiv.textContent = `Seguridad: ${strength}`;
            strengthDiv.className = `password-strength ${strengthClass}`;
        }

        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchDiv = document.getElementById('passwordMatch');
            
            if (confirmPassword.length === 0) {
                matchDiv.textContent = '';
                return;
            }

            if (password === confirmPassword) {
                matchDiv.textContent = '✓ Las contraseñas coinciden';
                matchDiv.className = 'password-strength strength-strong';
            } else {
                matchDiv.textContent = '✗ Las contraseñas no coinciden';
                matchDiv.className = 'password-strength strength-weak';
            }
        }

        function createUser(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden');
                return;
            }

            if (password.length < 8) {
                alert('La contraseña debe tener al menos 8 caracteres');
                return;
            }

            const storedUsers = JSON.parse(localStorage.getItem('masterbikes_users')) || [];
            const existingUser = storedUsers.find(user => user.username === username);
            if (existingUser) {
                alert('El nombre de usuario ya existe');
                return;
            }

            const newUser = {
                username: username,
                password: password,
                role: selectedRole,
                name: fullName,
                email: email,
                phone: document.getElementById('phone').value,
                created: new Date().toISOString(),
                status: 'Activo'
            };

            storedUsers.push(newUser);
            localStorage.setItem('masterbikes_users', JSON.stringify(storedUsers));

            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';

            document.getElementById('userForm').reset();
            checkPasswordStrength();
            checkPasswordMatch();

            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        function checkAuth() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            
            if (currentUser.role !== 'admin') {
                alert('No tienes permisos para crear usuarios');
                window.location.href = 'index.html';
                return;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            createNatureElements();
            initializeForm();
        });
    </script>
</body>
</html>
